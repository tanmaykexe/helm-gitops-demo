apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "my-nginx.fullname" . }}-pre-upgrade
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "my-nginx.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      containers:
        - name: pre-upgrade
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Helm pre-upgrade hook executed successfully"
