apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "my-nginx.fullname" . }}
  labels:
    {{- include "my-nginx.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "my-nginx.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "my-nginx.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      serviceAccountName: {{ include "my-nginx.serviceAccountName" . }}

      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"

          {{- if .Values.podEnvironment.enabled }}
          env:
            - name: ENVIRONMENT
              value: {{ .Values.podEnvironment.value | quote }}

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: my-nginx-db
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: my-nginx-db
                  key: DB_PASSWORD

            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "my-nginx.fullname" . }}-config
                  key: APP_NAME

            - name: APP_MODE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "my-nginx.fullname" . }}-config
                  key: APP_MODE

            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "my-nginx.fullname" . }}-config
                  key: LOG_LEVEL
          {{- end }}

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP

          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
